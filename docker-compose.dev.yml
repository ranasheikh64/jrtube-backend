services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jrtube-backend-api-dev
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jrtube-network

  redis:
    image: redis:7-alpine
    container_name: jrtube-backend-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jrtube-network

volumes:
  redis_dev_data:

networks:
  jrtube-network:
    driver: bridge
