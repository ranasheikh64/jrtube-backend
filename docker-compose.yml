services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jrtube-backend-api
    ports:
      - "${PORT:-8069}:8069"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Fallback to local redis if REDIS_URL is not provided in .env
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jrtube-network

  redis:
    image: redis:7-alpine
    container_name: jrtube-backend-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jrtube-network

volumes:
  redis_data:

networks:
  jrtube-network:
    driver: bridge
